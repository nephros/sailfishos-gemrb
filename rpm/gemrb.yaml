Name: gemrb
Summary: Open-source implementation of Bioware’s Infinity Engine.
Version: 0.9.4
Release: 0
Group: Applications
License: GPLv2
URL: https://github.com/gemrb/gemrb
SCM: https://github.com/nephros/sailfishos-gemrb
Sources:
    - '%{name}-%{version}.tar.gz'
    - GemRB.cfg
Patches:
  # SDL2_force_landscape.patch
  # SDL2_touch_abs_coord.patch // works without this
  - SDL2_wayland_rotate.patch
  - SDL2_wayland_rotate_link_wayland.patch
  # SDL2_always_rotate_270.patch
  # SDL2_always_rotate_90.patch
  # SDL2_switch_height_width.patch
  # SDL2_reverse_logical_dimensions.patch
  # SDL2_use_desktop_size.patch
  # SDL2_use_desktop_size2.patch
  - SDL2_fullscreen_via_zero.patch
  # SDL2_debug_messages.patch
  - SDL2_log_resize.patch
  - SFOS-no-ask-quit.patch
Requires:
  # '%{name}-demo'
Description: |
    GemRB (Game Engine Made with preRendered Background) is a portable
    open-source reimplementation of the Infinity Engine that underpinned Baldur's
    Gate, Icewind Dale and Planescape: Torment. It sports a cleaner design, greater
    extensibility and several innovations. Would you like to create a game like
    Baldur's Gate?

    To try it out you either need some of the ORIGINAL game's data or you can
    get a tiny sneak peek by running the included trivial game demo.

    The original game data has to be installed if you want to see anything but
    the included trivial demo. On non-windows systems either copy it over from
    a windows install, use a compatible installer, WINE or extract it manually
    from the CDs using the unshield tool.

    %if "%{?vendor}" == "chum"
    Title: GemRB Game Engine
    Type: desktop-application
    PackagedBy: nephros
    Categories:
     - Game
     - Emulator
    Custom:
      Repo: %{url}
      PackagingRepo: https://github.com/nephros/sailfishos-gemrb
    PackageIcon: https://gemrb.org/assets/img/site/favicon/apple-touch-icon.png
    Screenshots:
        https://gemrb.org/assets/img/site/main-header.jpg
    Links:
      Homepage: https://gemrb.org/
      Help: https://gemrb.org/Documentation.html
      Bugtracker: %{url}/issues
    %endif

SetupOptions: -q -n %{name}-%{version}/upstream
RpmLintIgnore:
  - 'summary-too-long'
  - 'no-changelogname-tag'
  - 'invalid-url'
  - 'desktopfile-without-binary'
  - 'explicit-lib-dependency'
  - 'arch-dependent-file-in-usr-share'
  - 'devel-file-in-non-devel-package'
Macros:
  - '_orgname;org.gemrb'
  - '_appname;gemrb'
  - '_gamedatadir;%{_datadir}/%{_orgname}.%{_appname}'
#  - |
#    spectacle_bug; hack_fix
#    # Spectacular spectacle hack:
#    #   abuse Macros to work around the Macro-deleting bug in 0.32
#    #   also, add a conditional dep:
#    %if 0%{?sailfishos_version} >= 30400
#    BuildRequires: some-package
#    %endif

PkgBR:
  - cmake >= 3.25
  - extra-cmake-modules
  - gcc-c++
  - python3-base >= 3.3
  - python3-libs >= 3.3
  # just for shebang fixing
  - python3-rpm-macros
  - desktop-file-utils

PkgConfigBR:
  - sdl2
  - SDL2_mixer
  - python3
  - egl # for KHR/khrplatform.h
  - freetype2
  - glesv2
  - libpng
  - ogg
  - openal # works with only sdlaudio as well
  - vorbis
  - vorbisfile
  - wayland-client # for the landscape fix
  - wayland-egl
  - zlib
Builder: cmake
Configure: cmake
ConfigOptions:
  - '-B%{_builddir}/_build'
  - '-DSDL_BACKEND=SDL2'
  # compiles but does not work on aarch64
  # '-DOPENGL_BACKEND=GLES'
  # '-DOPENGL_BACKEND=OpenGL'
  # '-DPREFIX='
  - '-DLIB_DIR=%{_libexecdir}/%{name}'
  - '-DPLUGIN_DIR=%{_gamedatadir}/plugins/'
  # '-DBIN_DIR'
  - '-DDATA_DIR=%{_gamedatadir}'
  - '-DSYSCONF_DIR=%{_gamedatadir}/config/'
  # '-DDOC_DIR'
  - '-DICON_DIR=%{_datadir}/icons/hicolor/64x64/apps'
  # '-DSVG_DIR'
  # '-DMENU_DIR'
  - '-DUSE_LIBVLC=OFF'
  # required??
  - 'CFLAGS="${CFLAGS} -DSDL_RESOLUTION_INDEPENDANCE"'
Builder: none
NoIconCache: true
Files:
  - '%license COPYING'
  - '%{_bindir}/*'
  - '%{_datadir}/applications/%{_orgname}.%{_appname}.desktop'
  - '%{_datadir}/icons/*/scalable/apps/%{name}.svg'
  - '%{_datadir}/icons/*/*/apps/*.png'
  - '%{_libexecdir}/%{name}/'
  - '%{_gamedatadir}/'
  - '%exclude %{_gamedatadir}/demo'
  - '%exclude %{_gamedatadir}/GUIScripts/demo'
  - '%exclude %{_datadir}/applications/gemrb.desktop'
  - '%exclude %{_datadir}/metainfo/*.xml'
  - '%exclude %{_datadir}/metainfo'

SubPackages:
    - Name:  demo
      Summary: Demo data files for %{name}
      Group: Applications
      BuildArch: noarch
      Files:
        - '%{_gamedatadir}/demo/'
        - '%{_gamedatadir}/GUIScripts/demo/'
